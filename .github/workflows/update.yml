name: Refresh good news
on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 minutes (free for public repos)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: pages
        uses: actions/configure-pages@v5
      - run: pip install pillow
      - run: python3 build.py --out site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}   # optional: live newsletter count on the admin Goals tab
      # Smoke tests: if the new build is broken, stop here and keep the last good site live (GitHub emails you).
      - run: pip install pytest && python3 -m pytest -q tests
        env: { SITE_DIR: site }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      # GitHub sometimes can't see a just-uploaded artifact yet ("Fetching artifact metadata failed"),
      # which failed about 1 run in 6. Give it a moment, and try once more if the first deploy fails.
      - run: sleep 10
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # Facebook posting (replaces the Zapier RSS Zaps). Runs only once the site is live, so every image is reachable.
      # Dry run until the repo variable FB_POSTING is "on". If a post fails, this step fails and GitHub emails you.
      - name: Post to Facebook
        if: github.event_name != 'push' && (steps.deploy.outcome == 'success' || steps.deploy2.outcome == 'success')
        run: python3 fb_post.py site
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_POSTING: ${{ vars.FB_POSTING }}
      # Health alert: fails (and GitHub emails you) when news goes stale or feeds break. Checked once an hour.
      - name: Site health
        if: github.event_name == 'schedule' && (steps.deploy.outcome == 'success' || steps.deploy2.outcome == 'success')
        run: |
          if [ "$(date -u +%M)" -lt 15 ]; then python3 tools/health_check.py site; fi
